services:
  - type: web
    name: railsaathi
    runtime: python
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py seed_data
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: railsaathi-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_ALLOWED_HOSTS
        value: "railsaathi.onrender.com"
      - key: TWILIO_WHATSAPP_ENABLED
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.10"

databases:
  - name: railsaathi-db
    databaseName: railsaathi
    user: railsaathi
    plan: free
